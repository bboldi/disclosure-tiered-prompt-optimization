[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbench-v2"
version = "0.1.0"
description = "Offline-first, auditable prompt optimization experiments"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.9"]
gepa = ["gepa @ git+https://github.com/gepa-ai/gepa.git@15ee314f9c7d34ec153b809d401f42f55c4dcd76"]

[tool.setuptools.packages.find]
include = ["promptbench*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["promptbench"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "run_log"]
